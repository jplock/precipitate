# Items from our own crates are brought in with `use`, not spelled inline as
# `crate::sizing::inputs::Finding` or `precip_engine::sizing::Sizing`:
# import the type, trait or const directly, and import a function's parent
# module (`use precip_engine::sizing;` then `sizing::Sizing::new(..)`).
# `clippy::absolute_paths` flags any path of more than two segments rooted
# at a crate. Every external crate is listed below so the lint reports only
# `crate::` and workspace crate paths. The lint is denied in
# `[workspace.lints.clippy]`; a new external dependency named by an absolute
# path belongs in this list.
absolute-paths-max-segments = 2
absolute-paths-allowed-crates = [
    "std",
    "core",
    "alloc",
    "proc_macro",
    "anyhow",
    "aws_config",
    "aws_credential_types",
    "aws_sdk_autoscaling",
    "aws_sdk_cloudformation",
    "aws_sdk_dynamodb",
    "aws_sdk_ec2",
    "aws_sdk_ecs",
    "aws_sdk_efs",
    "aws_sdk_eks",
    "aws_sdk_elasticache",
    "aws_sdk_elasticloadbalancingv2",
    "aws_sdk_lambda",
    "aws_sdk_organizations",
    "aws_sdk_rds",
    "aws_sdk_resourceexplorer2",
    "aws_sdk_resourcegroupstagging",
    "aws_sdk_sts",
    "aws_smithy_async",
    "camino",
    "clap",
    "crossterm",
    "jiff",
    "mimalloc",
    "ratatui",
    "sea_query",
    "sea_query_sqlx",
    "serde",
    "serde_json",
    "sha2",
    "sqlx",
    "thiserror",
    "tokio",
    "toml",
    "tracing",
    "tracing_subscriber",
    "uuid",
    "xdg",
]

disallowed-methods = [
    { path = "tempfile::tempdir", reason = "use camino_tempfile::tempdir instead, which yields a Utf8TempDir" },
    { path = "tempfile::tempfile", reason = "use camino_tempfile::tempfile instead" },
]

disallowed-types = [
    { path = "tempfile::TempDir", reason = "use camino_tempfile::Utf8TempDir instead" },
    { path = "std::path::PathBuf", reason = "use camino::Utf8PathBuf; paths in this tool are always UTF-8" },
]
