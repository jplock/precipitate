# Oxide Gen 2 ("Cosmo") sled, 1152 GiB DRAM, in a 24-sled rack. Sources
# as of 2026-10-14; docs/rfd/0001/notes.adoc has the links.
#   oxide.computer/product/specifications: sleds per rack, the 192-core
#     AMD EPYC 9005, the 1152 GiB memory option, 10 NVMe bays.
#   Omicron source on GitHub: reservation_gib, reservoir_pct (PR 10791),
#     every [instance] limit.
# The operator guide does not yet publish usable memory and storage for
# this sled, so they are derived from DRAM, the reservation and the
# reservoir, and from the bays and Crucible's three-way replication.
name = "gen2-1152"
oxide_release = "21"
sleds_per_rack = 24

[sled]
cores = 192
threads_per_core = 2
dram_gib = 1152
reservation_gib = 44
reservoir_pct = 0.91
nvme_bays = 10
bay_size_tib = 2.9

[instance]
max_vcpu = 254
max_memory_gib = 1536
max_disks = 12
max_disk_gib = 1023
max_nics = 8

[storage]
# Unconfirmed. The operator guide gives 26.6 TiB usable per sled; this
# factor must reproduce that from the raw NVMe capacity.
replication_factor = 3
