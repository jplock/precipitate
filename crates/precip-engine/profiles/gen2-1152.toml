# Oxide Gen 2 sled, 1152 GiB DRAM. Each figure's source, as of
# 2026-10-13, is noted beside it; docs/rfd/0001/notes.adoc has the links.
#   Omicron source on GitHub: reservation_gib, reservoir_pct (PR 10791),
#     every [instance] limit.
#   oxide.computer product specifications page: sleds_per_rack, cores,
#     dram_gib, nvme_bays, bay_size_tib.
#   Operator resource-management guide: the 26.6 TiB usable storage the
#     replication factor is meant to reproduce.
name = "gen2-1152"
oxide_release = "21"
sleds_per_rack = 24

[sled]
cores = 192
threads_per_core = 2
dram_gib = 1152
reservation_gib = 44
reservoir_pct = 0.91
nvme_bays = 10
bay_size_tib = 2.9

[instance]
max_vcpu = 254
max_memory_gib = 1536
max_disks = 12
max_disk_gib = 1023
max_nics = 8

[storage]
# Unconfirmed. The operator guide gives 26.6 TiB usable per sled; this
# factor must reproduce that from the raw NVMe capacity.
replication_factor = 3
