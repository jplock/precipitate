[package]
name = "precip"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Scan AWS, Azure, Google Cloud and OCI estates and size them for Oxide racks"

[[bin]]
name = "precip"
path = "src/main.rs"

[dependencies]
aws-config = { workspace = true, features = ["rt-tokio", "default-https-client"] }
anyhow = { workspace = true, features = ["std"] }
camino = { workspace = true }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "color"] }
jiff = { workspace = true, features = ["std", "tz-system"] }
mimalloc = { workspace = true, features = ["secure"] }
precip-aws.workspace = true
precip-azure.workspace = true
precip-collect.workspace = true
precip-db.workspace = true
precip-tui.workspace = true
precip-engine.workspace = true
precip-gcp.workspace = true
precip-oci.workspace = true
precip-types.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "ansi", "env-filter", "std"] }

# XDG directories exist only on Unix; Windows uses %LOCALAPPDATA%.
[target.'cfg(unix)'.dependencies]
xdg = { workspace = true }

[lints]
workspace = true
