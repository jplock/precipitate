# Cuts a release from a `v*` tag: the same gates as every push, a check
# that the tag matches the workspace version, the five signed binaries from
# release-build.yml, and a GitHub release with SHA256SUMS and notes from the
# merged pull requests. Pull requests that change the release workflows, and
# manual runs, build everything but publish nothing.
#
# To release: set `version` in the workspace Cargo.toml, merge, then push
# the matching tag, such as `git tag v0.2.0 && git push origin v0.2.0`.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-build.yml
  workflow_dispatch:

permissions: {}

jobs:
  gates:
    name: gates
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  version:
    name: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match the tag to the workspace version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "${REF_TYPE}" = "tag" ]; then
            if [ "${REF_NAME}" != "v${crate}" ]; then
              echo "::error::tag ${REF_NAME} does not match the workspace version ${crate}"
              exit 1
            fi
            echo "version=${crate}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${crate}-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: [gates, version]
    concurrency:
      group: release-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE_NAME: ${{ secrets.APPLE_CERTIFICATE_NAME }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      CERTIFICATE_PROFILE: ${{ secrets.CERTIFICATE_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  publish:
    name: publish
    if: github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-latest
    # Never cancelled: once the release exists, stopping would leave it
    # without its assets.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # No checkout: this job only publishes what the build uploaded.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Collect SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # Verify against the sums each builder wrote, then publish one file.
          sha256sum -c -- *.sha256
          rm ./*.sha256
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
      - name: Publish
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag ./dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          # With no checkout there is no git remote to name the repository.
          GH_REPO: ${{ github.repository }}
