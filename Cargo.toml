[workspace]
resolver = "3"
members = [
  "crates/precip",
  "crates/precip-aws",
  "crates/precip-azure",
  "crates/precip-collect",
  "crates/precip-db",
  "crates/precip-engine",
  "crates/precip-gcp",
  "crates/precip-oci",
  "crates/precip-tui",
  "crates/precip-types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.99"
repository = "https://github.com/jplock/precipitate"

# Every dependency is pinned to an exact version with default features off.
# Member crates enable only the features they use.
[workspace.dependencies]
precip-aws = { path = "crates/precip-aws" }
precip-azure = { path = "crates/precip-azure" }
precip-collect = { path = "crates/precip-collect" }
precip-db = { path = "crates/precip-db" }
precip-engine = { path = "crates/precip-engine" }
precip-gcp = { path = "crates/precip-gcp" }
precip-oci = { path = "crates/precip-oci" }
precip-tui = { path = "crates/precip-tui" }
precip-types = { path = "crates/precip-types" }

anyhow = { version = "=1.0.104", default-features = false }
async-trait = { version = "=0.1.89", default-features = false }
azure_core = { version = "=1.1.0", default-features = false }
azure_identity = { version = "=1.0.0", default-features = false }
aws-lc-rs = { version = "=1.18.2", default-features = false }
aws-config = { version = "=1.12.0", default-features = false }
aws-credential-types = { version = "=1.3.0", default-features = false }
aws-sdk-autoscaling = { version = "=1.135.0", default-features = false }
aws-sdk-cloudformation = { version = "=1.131.0", default-features = false }
aws-sdk-dynamodb = { version = "=1.130.0", default-features = false }
aws-sdk-ec2 = { version = "=1.267.0", default-features = false }
aws-sdk-ecs = { version = "=1.150.0", default-features = false }
aws-sdk-efs = { version = "=1.118.0", default-features = false }
aws-sdk-eks = { version = "=1.154.0", default-features = false }
aws-sdk-elasticache = { version = "=1.124.0", default-features = false }
aws-sdk-elasticloadbalancingv2 = { version = "=1.129.0", default-features = false }
aws-sdk-lambda = { version = "=1.150.1", default-features = false }
aws-sdk-organizations = { version = "=1.131.0", default-features = false }
aws-sdk-rds = { version = "=1.154.0", default-features = false }
aws-sdk-resourceexplorer2 = { version = "=1.119.0", default-features = false }
aws-sdk-resourcegroupstagging = { version = "=1.114.0", default-features = false }
aws-sdk-sts = { version = "=1.119.0", default-features = false }
# The pagination stream type the SDK crates return; pinned to the version
# they use so one helper can page through any of them.
aws-smithy-async = { version = "=1.3.0", default-features = false }
google-cloud-auth = { version = "=1.17.0", default-features = false }
hcl-rs = { version = "=0.19.9", default-features = false }
http = { version = "=1.5.0", default-features = false }
base64 = { version = "=0.23.1", default-features = false }
camino = { version = "=1.2.6", default-features = false }
jiff = { version = "=0.2.38", default-features = false }
mimalloc = { version = "=0.1.52", default-features = false }
clap = { version = "=4.6.7", default-features = false }
configparser = { version = "=3.3.0", default-features = false }
crossterm = { version = "=0.29.0", default-features = false }
ratatui = { version = "=0.30.2", default-features = false }
sea-query = { version = "=1.0.2", default-features = false }
sea-query-sqlx = { version = "=0.9.1", default-features = false }
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "=1.0.229", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
serde_json = { version = "=1.0.154", default-features = false }
sqlx = { version = "=0.9.0", default-features = false }
thiserror = { version = "=2.0.21", default-features = false }
tokio = { version = "=1.53.3", default-features = false }
toml = { version = "=1.1.8", default-features = false }
tracing = { version = "=0.1.44", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false }
uuid = { version = "=1.28.0", default-features = false }
xdg = { version = "=3.0.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

# Mirrors Omicron's tree-wide Clippy configuration.
[workspace.lints.clippy]
style = { level = "allow", priority = -1 }
disallowed_macros = "warn"
disallowed_methods = "warn"
disallowed_names = "warn"
disallowed_script_idents = "warn"
disallowed_types = "warn"
iter_cloned_collect = "warn"
iter_next_slice = "warn"
iter_nth = "warn"
iter_nth_zero = "warn"
iter_skip_next = "warn"
len_zero = "warn"
redundant_field_names = "warn"
declare_interior_mutable_const = "warn"
cast_lossless = "warn"
literal_string_with_formatting_args = "warn"
# Output goes through `out!` in the binary, which stops quietly on a
# closed pipe; the library crates return data and log through tracing.
# Every variant is named, so a new one forces a decision at each match.
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
print_stdout = "deny"
print_stderr = "deny"
absolute_paths = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
