# Static Linux binaries are built with cargo-zigbuild so that the bundled
# SQLite C sources link against musl without a cross toolchain:
#
#   cargo zigbuild --release --target x86_64-unknown-linux-musl
#   cargo zigbuild --release --target aarch64-unknown-linux-musl
#
# Release CI builds them natively in Alpine instead. Windows binaries link
# the C runtime statically so they need no Visual C++ redistributable.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
